# Render Blueprint (https://render.com/docs/blueprint-spec)
# Always-on Starter ($7/mo) + 1 GB Persistent SSD Disk ($0.25/mo) on Hobby Workspace ($0/mo).
services:
  - type: web
    name: steam-free-to-keep-tracker
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    disk:
      name: tracker-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TARGET_REGION
        value: IN
      - key: STEAM_COUNTRY_CODE
        value: in
      - key: DEFAULT_CURRENCY
        value: INR
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_PATH
        value: /app/data/steam_tracker.db
      - key: PDF_CACHE_DIR
        value: /app/data/reports
      - key: BACKUP_DIR
        value: /app/data/backups
      - key: TRIGGER_API_KEY
        generateValue: true
      - key: NTFY_TOPIC
        sync: false
      - key: NTFY_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
